# =============================================================================
#  KN ML · ADAS 4WD Demo
#  Start:  docker compose up --build        Dashboard:  http://localhost:8000
# =============================================================================
name: knml-robot

services:
  robot:
    build: .
    image: knml/robot-adas:latest
    container_name: knml-robot
    restart: unless-stopped
    init: true
    stop_grace_period: 5s

    # Dostęp do sprzętu bez listy "devices:".
    # Lista devices: wywala start kontenera, gdy urządzenia nie ma. Zamiast tego:
    #  - privileged: dostęp do wszystkich urządzeń (USB, tty, video),
    #  - /dev montowany w całości: urządzenia podpięte PO starcie kontenera
    #    (hot-plug: OAK-D, LiDAR /dev/ttyUSB*, ESP32 /dev/ttyACM* / ttyAMA0,
    #    kamera /dev/video*) od razu pojawiają się w środku. OAK-D zmienia
    #    VID/PID przy bootowaniu (/dev/bus/usb), co też obsługuje ten mount.
    privileged: true
    volumes:
      - /dev:/dev
      - ./assets:/app/assets:ro          # logotypy – podmiana bez przebudowy

    ports:
      - "${PORT:-8000}:8000"

    # Opcjonalna konfiguracja (skopiuj .env.example -> .env). Brak pliku = domyślne.
    env_file:
      - path: .env
        required: false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
