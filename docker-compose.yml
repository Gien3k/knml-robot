# =============================================================================
#  KN ML · Autonomiczny Łazik 4WD
#
#  Laptop (symulacja, Docker Desktop / Windows / Linux):
#      docker compose up --build             ->  http://localhost:8090
#
#  Raspberry Pi 5 (prawdziwy sprzęt) – ten plik + nakładka:
#      docker compose -f docker-compose.yml -f docker-compose.rpi.yml up -d --build
#      (albo COMPOSE_FILE=docker-compose.yml:docker-compose.rpi.yml w .env – robi to setup_rpi.sh)
# =============================================================================
name: knml-robot

services:
  robot:
    build: .
    image: knml/robot-demo:latest
    container_name: knml-robot
    init: true
    stop_grace_period: 5s
    ports:
      - "${PORT:-8090}:8000"
    volumes:
      - ./assets:/app/assets:ro          # logotypy – podmiana bez przebudowy
      - ./data:/app/data                 # kalibracja radaru – przetrwa przebudowę i restart
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
