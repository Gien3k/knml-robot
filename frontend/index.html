<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181a">
  <title>Człowiek kontra AI – autonomiczny łazik</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <!-- obraz z kamery na cały ekran (nad stopką) -->
    <div class="cam-box" id="camBox">
      <div class="cam-inner"><img id="cam" alt=""><canvas id="ov"></canvas></div>
      <div class="cam-wait" id="camWait">Czekam na kamerę</div>
    </div>
    <div class="shade-top" aria-hidden="true"></div>
    <div class="shade-bottom" aria-hidden="true"></div>
    <div class="alarm" aria-hidden="true"></div>

    <!-- nagłówek jak na drugim monitorze stoiska -->
    <header class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 12 L20 20 L10 28 M10 12 L10 28 M20 20 H31"/></g><circle cx="10" cy="12" r="3.2" fill="currentColor"/><circle cx="10" cy="28" r="3.2" fill="currentColor"/><circle cx="20" cy="20" r="3.2" fill="currentColor"/><circle cx="31" cy="20" r="3.6" fill="#6cb4ff"/></svg>
        <span class="wordmark">Człowiek kontra AI</span>
        <i class="wordmark-rule" aria-hidden="true"></i>
        <span class="wordmark-sub">Autonomiczny łazik</span>
      </div>
      <span class="sim-badge" id="simBadge" hidden>Symulacja</span>
    </header>

    <section class="status" aria-live="polite">
      <h1 id="title">Łączę się z robotem</h1>
      <p id="line">To potrwa chwilę.</p>
      <p class="record" id="record"></p>
    </section>

    <section class="hud">
      <figure class="hud-wheels">
        <canvas id="chassis"></canvas>
        <figcaption>Koła</figcaption>
      </figure>
      <figure class="hud-radar">
        <div class="disc"><canvas id="radar"></canvas></div>
        <figcaption>Radar wokół robota</figcaption>
      </figure>
    </section>

    <!-- stopka identyczna jak na drugim monitorze stoiska -->
    <footer class="credits">
      <img id="logoKolo" src="/branding/kolo" alt="Koło Naukowe Machine Learning Politechniki Rzeszowskiej" draggable="false">
      <i class="credits-rule" aria-hidden="true"></i>
      <img id="logoRzeszow" src="/branding/rzeszow" alt="Rzeszów – stolica innowacji" draggable="false">
      <div class="diag" id="diag" aria-label="Stan czujników"></div>
    </footer>

    <!-- ukryta kalibracja radaru: 5 szybkich kliknięć w logo Koła + hasło obsługi -->
    <div class="modal" id="calibAuth" hidden>
      <div class="auth-box" id="authBox">
        <h2>Kalibracja radaru</h2>
        <p>Wpisz hasło obsługi stoiska</p>
        <div class="auth-field" id="authField"></div>
        <div class="auth-error" id="authError"></div>
        <div class="keys" id="authKeys"></div>
        <div class="actions">
          <button type="button" class="btn ghost" id="authCancel">Anuluj</button>
          <button type="button" class="btn" id="authOk">Dalej</button>
        </div>
      </div>
    </div>

    <div class="modal" id="calib" hidden>
      <div class="calib-box">
        <div class="calib-top"><span id="calibStep">Krok 1 z 5</span><span>Kalibracja radaru</span></div>
        <div class="calib-main">
          <div class="calib-text">
            <h2 id="calibTitle">–</h2>
            <p id="calibHint"></p>
            <ul class="calib-checks" id="calibChecks"></ul>
            <p class="calib-msg" id="calibMsg"></p>
          </div>
          <div class="calib-figure">
            <canvas id="calibDiagram"></canvas>
            <div class="calib-count" id="calibCount"></div>
          </div>
        </div>
        <div class="calib-progress"><div class="calib-bar"><i id="calibBar"></i></div><b id="calibPct">0%</b></div>
        <div class="actions">
          <button type="button" class="btn ghost" id="calibSkip" hidden>Pomiń ten krok</button>
          <button type="button" class="btn ghost" id="calibCancel">Przerwij</button>
          <button type="button" class="btn" id="calibClose" hidden>Zamknij</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
